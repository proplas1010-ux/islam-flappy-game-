<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İslam's Flappy Space</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; user-select: none; }
        body {
            background-color: #050510; height: 100vh;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        #game-container {
            position: relative; width: 400px; height: 600px;
            background: linear-gradient(to bottom, #0b0b26, #050510);
            border: 2px solid #00d2ff; border-radius: 10px; overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
        }
        canvas { display: block; background: transparent; }

        /* GİRİŞ MENUSU və GAME OVER EKRANI */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 20, 0.9); z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; transition: opacity 0.3s ease;
        }
        h1 { font-size: 36px; color: #00d2ff; margin-bottom: 10px; text-shadow: 0 0 15px #00d2ff; }
        .creator { font-size: 18px; color: #ff007f; font-weight: bold; margin-bottom: 40px; text-shadow: 0 0 8px #ff007f; }
        .btn {
            padding: 12px 35px; font-size: 18px; font-weight: bold;
            background: linear-gradient(45deg, #00d2ff, #0066ff);
            color: white; border: none; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        #score-board {
            position: absolute; top: 20px; left: 0; width: 100%;
            text-align: center; color: white; font-size: 32px; font-weight: bold;
            z-index: 5; text-shadow: 2px 2px 4px #000; display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canlı Xal Tablosu -->
        <div id="score-board">0</div>

        <!-- GİRİŞ MENUSU -->
        <div id="main-menu" class="overlay-screen">
            <h1>FLAPPY SPACE</h1>
            <div class="creator">Yaradıcı: İslam Şahbazov</div>
            <button class="btn" onclick="startGame()">Oyunu Başlat 🚀</button>
            <p style="color: #aaa; font-size: 13px; margin-top: 20px;">Uçmaq üçün PROBEL (Space) və ya KLİKLƏYİN</p>
        </div>

        <!-- GAME OVER EKRANI -->
        <div id="game-over" class="overlay-screen" style="display: none;">
            <h1>OYUN BİTDİ!</h1>
            <p style="font-size: 20px; margin: 10px 0 30px 0;">Topladığın Xal: <span id="final-score">0</span></p>
            <button class="btn" onclick="restartGame()">Yenidən Oyna 🔄</button>
        </div>

        <!-- Oyunun qrafikasının çəkiləcəyi yer -->
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Oyun Dəyişənləri
        let ship, pipes, frame, score, gameInterval, isPlaying = false;
        
        const gravity = 0.25;
        const jump = -5.5;
        const pipeSpeed = 2.5;
        const pipeGap = 140; // Boruların arasındakı boşluq məsafəsi

        // Düymə və klik hadisələri
        window.addEventListener("keydown", (e) => { if (e.code === "Space") flap(); });
        canvas.addEventListener("touchstart", flap);
        canvas.addEventListener("mousedown", flap);

        function flap() {
            if (isPlaying) ship.velocity = jump;
        }

        function startGame() {
            document.getElementById("main-menu").style.display = "none";
            document.getElementById("score-board").style.display = "block";
            initGame();
        }

        function restartGame() {
            document.getElementById("game-over").style.display = "none";
            initGame();
        }

        function initGame() {
            ship = { x: 50, y: 250, w: 34, h: 24, velocity: 0 };
            pipes = [];
            frame = 0;
            score = 0;
            isPlaying = true;
            document.getElementById("score-board").innerText = score;
            
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 20); // Saniyədə 50 kadr (FPS)
        }

        function updateGame() {
            frame++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gəminin Fizikası
            ship.velocity += gravity;
            ship.y += ship.velocity;

            // Döşəməyə və ya tavanı vurduqda uduzmaq
            if (ship.y + ship.h > canvas.height || ship.y < 0) {
                gameOver();
                return;
            }

            // Gəmini Ekran Qrafikası olaraq çəkmək (Futuristik üçbucaq gəmi)
            ctx.fillStyle = "#00d2ff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00d2ff";
            ctx.beginPath();
            ctx.moveTo(ship.x + ship.w, ship.y + ship.h / 2);
            ctx.lineTo(ship.x, ship.y);
            ctx.lineTo(ship.x, ship.y + ship.h);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0; // kölgəni sıfırlayırıq ki borulara təsir etməsin

            // Hər 100 kadrdan bir yeni boru (maneə) yaradırıq
            if (frame % 100 === 0) {
                let minHeight = 50;
                let maxHeight = canvas.height - pipeGap - 50;
                let height = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
                
                pipes.push({ x: canvas.width, topH: height, botY: height + pipeGap, w: 60, passed: false });
            }

            // Boruların hərəkəti və çəkilməsi
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;

                ctx.fillStyle = "#ff007f";
                // Üst boru
                ctx.fillRect(pipes[i].x, 0, pipes[i].w, pipes[i].topH);
                // Alt boru
                ctx.fillRect(pipes[i].x, pipes[i].botY, pipes[i].w, canvas.height - pipes[i].botY);

                // Toqquşma (Collision) Yoxlanışı
                if (
                    ship.x < pipes[i].x + pipes[i].w &&
                    ship.x + ship.w > pipes[i].x &&
                    (ship.y < pipes[i].topH || ship.y + ship.h > pipes[i].botY)
                ) {
                    gameOver();
                    return;
                }

                // Xal Qazanmaq
                if (!pipes[i].passed && pipes[i].x + pipes[i].w < ship.x) {
                    score++;
                    pipes[i].passed = true;
                    document.getElementById("score-board").innerText = score;
                }

                // Ekrandan çıxan boruları silirik ki kompüter donmasın
                if (pipes[i].x + pipes[i].w < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            document.getElementById("final-score").innerText = score;
            document.getElementById("game-over").style.opacity = "0";
            document.getElementById("game-over").style.display = "flex";
            setTimeout(() => { document.getElementById("game-over").style.opacity = "1"; }, 50);
        }
    </script>
</body>
</html>
